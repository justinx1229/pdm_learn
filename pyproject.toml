[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdm-learn"
version = "1.0.0"
description = "General feature learning from aligned matrix datasets."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["feature engineering", "machine learning", "matrix analysis", "density estimation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/justinx1229/pdm_learn"
Source = "https://github.com/justinx1229/pdm_learn"
Issues = "https://github.com/justinx1229/pdm_learn/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
review = [
    "jupyterlab>=4.3",
]

[tool.hatch.build]
exclude = [
    "/.git/",
    "/.uv-cache/",
    "/.venv/",
    "/archive/",
    "/artifacts/",
    "/build/",
    "/data/",
    "/dist/",
    "/figures/",
    "/notebooks/",
    "/scripts/",
    "/tests/test_oncogene_ks_heatmap.py",
    "/tests/test_ppi_prediction_controls.py",
    "/tests/test_reproduction_scripts.py",
    "/tests/test_simulation.py",
    "/tests/test_workflows.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdm_learn"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/pdm_learn/**/*.py",
    "/tests/**/*.py",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/DATA.md",
    "/RELEASE.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
