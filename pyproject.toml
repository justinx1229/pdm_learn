[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdm-learn"
version = "0.3.0"
description = "General feature learning from aligned matrix datasets."
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "seaborn>=0.13,<1",
    "sympy>=1.12,<2",
    "tqdm>=4.66,<5",
    "xgboost>=2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdm_learn"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pdm_learn",
    "tests",
    "README.md",
    "pyproject.toml",
]
